<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Глоссарий — BR67</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Unbounded:wght@600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --green: #00ff9d;
            --pink:  #ff2fd1;
            --bg-0:  #05060a;
            --text:  #eaf7f0;
            --muted: #8fa8a0;
        }

        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            color: var(--text);
            min-height: 100vh;
            background: var(--bg-0);
            background-image:
                radial-gradient(ellipse 80% 50% at 50% -10%, rgba(0, 255, 157, 0.18), transparent 60%),
                radial-gradient(ellipse 60% 50% at 80% 100%, rgba(255, 47, 209, 0.15), transparent 60%),
                radial-gradient(ellipse 60% 50% at 0% 100%, rgba(0, 255, 157, 0.10), transparent 60%);
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: -20%;
            background:
                radial-gradient(circle at 20% 30%, rgba(0, 255, 157, 0.06), transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255, 47, 209, 0.06), transparent 40%);
            filter: blur(60px);
            z-index: -1;
            animation: floatGlow 18s ease-in-out infinite alternate;
        }

        @keyframes floatGlow {
            0%   { transform: translate3d(0, 0, 0) scale(1); }
            100% { transform: translate3d(0, -3%, 0) scale(1.08); }
        }

        /* ───────── ШАПКА ───────── */
        header {
            text-align: center;
            padding: 70px 20px 10px;
            width: 100%;
        }

        h1 {
            font-family: 'Unbounded', sans-serif;
            font-weight: 800;
            font-size: clamp(2.2rem, 6vw, 4rem);
            letter-spacing: -0.02em;
            margin: 0;
            text-transform: uppercase;
            background: linear-gradient(100deg, var(--green) 0%, #d6ffe9 40%, var(--pink) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 22px rgba(0, 255, 157, 0.35))
                    drop-shadow(0 0 42px rgba(255, 47, 209, 0.18));
            animation: hueShift 8s ease-in-out infinite alternate;
        }

        @keyframes hueShift {
            0%   { filter: drop-shadow(0 0 22px rgba(0, 255, 157, 0.4)) drop-shadow(0 0 42px rgba(255, 47, 209, 0.18)); }
            100% { filter: drop-shadow(0 0 22px rgba(255, 47, 209, 0.4)) drop-shadow(0 0 42px rgba(0, 255, 157, 0.18)); }
        }

        .subtitle {
            font-size: 0.85rem;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            color: var(--muted);
            margin-top: 14px;
            font-weight: 500;
        }

        /* ───────── ВЫБОР БРЕЙНРОТА (слева) ───────── */
        .brainrot-section {
            width: min(1200px, 92%);
            margin: 40px 0 10px;
            display: flex;
            justify-content: flex-start;
        }

        .brainrot-card {
            display: flex;
            align-items: center;
            gap: 22px;
            padding: 18px 26px 18px 18px;
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition:
                transform 0.45s cubic-bezier(.2,.9,.3,1.2),
                box-shadow 0.4s ease,
                background 0.4s ease,
                opacity 0.4s ease;
            max-width: 560px;
        }

        .brainrot-card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background:
                radial-gradient(circle at 20% 50%, rgba(0, 255, 157, 0.18), transparent 55%),
                radial-gradient(circle at 90% 50%, rgba(255, 47, 209, 0.18), transparent 55%);
            opacity: 0.6;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .brainrot-card::after {
            content: "";
            position: absolute;
            inset: -1px;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(120deg, var(--green), var(--pink), var(--green));
            background-size: 200% 200%;
            -webkit-mask:
                linear-gradient(#000 0 0) content-box,
                linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
                    mask-composite: exclude;
            opacity: 0.7;
            animation: borderFlow 4s linear infinite;
            pointer-events: none;
        }

        @keyframes borderFlow {
            0%   { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .brainrot-card:hover {
            transform: translateY(-4px) scale(1.02);
            background: rgba(255, 255, 255, 0.07);
            box-shadow:
                0 18px 45px -12px rgba(0, 255, 157, 0.35),
                0 8px 30px -10px rgba(255, 47, 209, 0.35);
        }

        .brainrot-card img {
            width: 110px;
            height: 110px;
            object-fit: contain;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.35);
            padding: 8px;
            position: relative;
            z-index: 1;
            transition: transform 0.5s cubic-bezier(.2,.9,.3,1.2), filter 0.4s ease;
            filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.5));
        }

        .brainrot-card:hover img {
            transform: scale(1.08) rotate(-2deg);
            filter: drop-shadow(0 10px 22px rgba(0, 255, 157, 0.4));
        }

        .brainrot-info {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .brainrot-label {
            font-size: 0.7rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--muted);
            font-weight: 500;
        }

        .brainrot-name {
            font-family: 'Unbounded', sans-serif;
            font-weight: 600;
            font-size: 1.15rem;
            letter-spacing: 0.04em;
            color: #fff;
            text-shadow: 0 0 14px rgba(0, 255, 157, 0.4);
            transition: text-shadow 0.3s ease;
        }

        .brainrot-card:hover .brainrot-name {
            text-shadow: 0 0 20px rgba(255, 47, 209, 0.8);
        }

        .brainrot-hint {
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 4px;
            letter-spacing: 0.05em;
        }

        /* ───────── КНОПКА «НАЗАД» ───────── */
        .back-btn {
            display: none;
            align-self: flex-start;
            margin: 30px 0 0;
            padding: 10px 20px;
            font-family: 'Inter', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            color: #fff;
            border-color: var(--pink);
            box-shadow: 0 0 20px rgba(255, 47, 209, 0.4);
            transform: translateX(-4px);
        }

        .back-btn.visible {
            display: inline-block;
            animation: cardAppear 0.5s ease forwards;
        }

        /* ───────── РАЗДЕЛИТЕЛЬ ───────── */
        .divider {
            width: min(1200px, 92%);
            height: 1px;
            margin: 40px 0 40px;
            background: linear-gradient(90deg, rgba(0,255,157,0.5), rgba(255,47,209,0.5), transparent);
            position: relative;
            transition: opacity 0.4s ease;
        }
        .divider::after {
            content: "";
            position: absolute;
            left: 0;
            top: -2px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--pink);
            box-shadow: 0 0 16px var(--pink), 0 0 32px var(--pink);
        }

        /* ───────── СЕТКА КАРТОЧЕК ───────── */
        .grid-container {
            display: none;   /* ← по умолчанию скрыто, пока не выбран брейнрот */
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 22px;
            width: min(1200px, 92%);
            padding-bottom: 100px;
        }

        .grid-container.visible {
            display: grid;
        }

        .card {
            position: relative;
            border-radius: 20px;
            padding: 18px 16px 20px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.035);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition:
                transform 0.45s cubic-bezier(.2,.9,.3,1.2),
                border-color 0.4s ease,
                box-shadow 0.4s ease,
                background 0.4s ease;
            overflow: hidden;
            opacity: 0;
            transform: translateY(20px);
            animation: cardAppear 0.7s cubic-bezier(.2,.9,.3,1.2) forwards;
        }

        @keyframes cardAppear {
            to { opacity: 1; transform: translateY(0); }
        }

        .grid-container.visible .card:nth-child(1)  { animation-delay: 0.05s; }
        .grid-container.visible .card:nth-child(2)  { animation-delay: 0.10s; }
        .grid-container.visible .card:nth-child(3)  { animation-delay: 0.15s; }
        .grid-container.visible .card:nth-child(4)  { animation-delay: 0.20s; }
        .grid-container.visible .card:nth-child(5)  { animation-delay: 0.25s; }
        .grid-container.visible .card:nth-child(6)  { animation-delay: 0.30s; }
        .grid-container.visible .card:nth-child(7)  { animation-delay: 0.35s; }
        .grid-container.visible .card:nth-child(8)  { animation-delay: 0.40s; }
        .grid-container.visible .card:nth-child(9)  { animation-delay: 0.45s; }
        .grid-container.visible .card:nth-child(10) { animation-delay: 0.50s; }
        .grid-container.visible .card:nth-child(11) { animation-delay: 0.55s; }
        .grid-container.visible .card:nth-child(12) { animation-delay: 0.60s; }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background:
                radial-gradient(circle at 50% 0%, rgba(0, 255, 157, 0.18), transparent 55%),
                radial-gradient(circle at 50% 100%, rgba(255, 47, 209, 0.16), transparent 55%);
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        .card::after {
            content: "";
            position: absolute;
            inset: -1px;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(120deg, var(--green), var(--pink), var(--green));
            background-size: 200% 200%;
            -webkit-mask:
                linear-gradient(#000 0 0) content-box,
                linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
                    mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.4s ease;
            animation: borderFlow 4s linear infinite;
            pointer-events: none;
        }

        .card:hover {
            transform: translateY(-8px) scale(1.03);
            background: rgba(255, 255, 255, 0.06);
            box-shadow:
                0 18px 45px -12px rgba(0, 255, 157, 0.35),
                0 8px 30px -10px rgba(255, 47, 209, 0.35);
        }
        .card:hover::before { opacity: 1; }
        .card:hover::after  { opacity: 1; }

        .card img {
            width: 100%;
            height: 150px;
            object-fit: contain;
            border-radius: 12px;
            margin-bottom: 14px;
            transition: transform 0.5s cubic-bezier(.2,.9,.3,1.2), filter 0.4s ease;
            filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.5));
            position: relative;
            z-index: 1;
        }

        .card:hover img {
            transform: scale(1.12) rotate(-2deg);
            filter: drop-shadow(0 10px 22px rgba(0, 255, 157, 0.4));
        }

        .card span {
            font-family: 'Unbounded', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--text);
            transition: color 0.3s ease, text-shadow 0.3s ease;
            position: relative;
            z-index: 1;
        }

        .card:hover span {
            color: #ffffff;
            text-shadow: 0 0 14px rgba(255, 47, 209, 0.8);
        }

        /* ───────── МОДАЛЬНОЕ ОКНО ───────── */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(3, 6, 4, 0.85);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        .modal.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            max-width: 90%;
            max-height: 78vh;
            border-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow:
                0 0 60px rgba(0, 255, 157, 0.35),
                0 0 120px rgba(255, 47, 209, 0.25),
                0 25px 60px rgba(0, 0, 0, 0.6);
            animation: zoomIn 0.45s cubic-bezier(.2,.9,.3,1.2);
            background: rgba(0, 0, 0, 0.4);
        }

        .modal-title {
            margin-top: 22px;
            font-family: 'Unbounded', sans-serif;
            font-weight: 600;
            font-size: 1.4rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            background: linear-gradient(90deg, var(--green), var(--pink));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 18px rgba(255, 47, 209, 0.5));
            animation: zoomIn 0.5s 0.1s backwards cubic-bezier(.2,.9,.3,1.2);
        }

        .close-btn {
            position: absolute;
            top: 24px;
            right: 36px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 42px;
            font-weight: 300;
            line-height: 1;
            cursor: pointer;
            transition: color 0.3s ease, transform 0.3s ease, text-shadow 0.3s ease;
            user-select: none;
        }
        .close-btn:hover {
            color: var(--pink);
            transform: rotate(90deg);
            text-shadow: 0 0 20px var(--pink);
        }

        @keyframes zoomIn {
            from { transform: scale(0.75) translateY(20px); opacity: 0; }
            to   { transform: scale(1) translateY(0);       opacity: 1; }
        }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #05060a; }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, var(--green), var(--pink));
            border-radius: 10px;
        }

        /* ───────── АДАПТИВ ───────── */
        @media (max-width: 600px) {
            .brainrot-card {
                flex-direction: column;
                align-items: flex-start;
                text-align: left;
                max-width: 100%;
            }
            .brainrot-card img {
                width: 90px;
                height: 90px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Глоссарий</h1>
        <div class="subtitle">Мутации BR67</div>
    </header>

    <!-- Блок выбора брейнрота — слева -->
    <section class="brainrot-section">
        <div class="brainrot-card" id="brainrot-card">
            <img id="brainrot-img" src="" alt="Garama and Madundung">
            <div class="brainrot-info">
                <span class="brainrot-label">Брейнрот</span>
                <span class="brainrot-name">Garama and Madundung</span>
                <span class="brainrot-hint">Нажми, чтобы показать мутации →</span>
            </div>
        </div>
    </section>

    <!-- Кнопка «Назад» — появляется, когда мутации показаны -->
    <button class="back-btn" id="back-btn">← Назад к выбору</button>

    <div class="divider" id="divider"></div>

    <div class="grid-container" id="cards-container"></div>

    <div class="modal" id="modal">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <img class="modal-content" id="modal-img" alt="">
        <div class="modal-title" id="modal-title"></div>
    </div>

    <script>
        // Пути к файлам на GitHub
        const BASE_URL = "https://raw.githubusercontent.com/saintezz/garamsPHOTO/main/";
        const MUTATIONS_BASE = BASE_URL + "garamas/";

        // Картинка брейнрота в корне репозитория
        const BRAINROT_URL = BASE_URL + encodeURIComponent("garama and madung.webp");

        const placeholder = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="150" height="150"><rect width="100%" height="100%" fill="%23222"/><text x="50%" y="50%" fill="%23ff00ff" font-size="14" text-anchor="middle" dy=".3em">Нет файла</text></svg>';

        // ─── Список мутаций ───
        const mutations = [
            { file: "br67__galaxy.webp",      name: "Galaxy" },
            { file: "br67__gold (1).webp",    name: "Gold (1)" },
            { file: "br67__lava.webp",        name: "Lava" },
            { file: "br67__phantom.webp",     name: "Phantom" },
            { file: "br67__radioactive.webp", name: "Radioactive" },
            { file: "br67__rainbow.webp",     name: "Rainbow" },
            { file: "br67__yinyang.webp",     name: "Yin Yang" },
            { file: "br67__gold.webp",        name: "Gold" },
            { file: "br67__candy.webp",       name: "Candy" },
            { file: "br67__crystal.webp",     name: "Crystal" },
            { file: "br67__cyber.webp",       name: "Cyber" },
            { file: "br67__divine.webp",      name: "Divine" }
        ];

        // ─── Элементы ───
        const brainrotImg  = document.getElementById('brainrot-img');
        const brainrotCard = document.getElementById('brainrot-card');
        const gridContainer = document.getElementById('cards-container');
        const backBtn = document.getElementById('back-btn');
        const divider = document.getElementById('divider');

        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modal-img');
        const modalTitle = document.getElementById('modal-title');

        // ─── Заполняем блок брейнрота ───
        brainrotImg.src = BRAINROT_URL;
        brainrotImg.onerror = function() { this.src = placeholder; };

        // ─── Заполняем сетку мутаций (пока скрытую) ───
        mutations.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';

            const img = document.createElement('img');
            const url = MUTATIONS_BASE + encodeURIComponent(item.file);
            img.src = url;
            img.alt = item.name;
            img.onerror = function() { this.src = placeholder; };

            const title = document.createElement('span');
            title.innerText = item.name;

            card.appendChild(img);
            card.appendChild(title);
            card.onclick = () => openModal(url, item.name);
            gridContainer.appendChild(card);
        });

        // ─── Логика: клик по брейнроту → показываем мутации ───
        brainrotCard.onclick = () => {
            // Показываем сетку и кнопку «Назад», прячем сам блок брейнрота
            gridContainer.classList.add('visible');
            backBtn.classList.add('visible');
            brainrotCard.style.opacity = '0';
            brainrotCard.style.pointerEvents = 'none';
            // Плавно уменьшаем через таймаут, чтобы анимация сработала
            setTimeout(() => {
                brainrotCard.style.display = 'none';
            }, 400);
            // Прокрутка к сетке
            setTimeout(() => {
                gridContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 150);
        };

        // ─── Логика: кнопка «Назад» → возвращаемся к выбору брейнрота ───
        backBtn.onclick = () => {
            gridContainer.classList.remove('visible');
            backBtn.classList.remove('visible');
            brainrotCard.style.display = 'flex';
            // Небольшая задержка, чтобы transition сработал
            requestAnimationFrame(() => {
                brainrotCard.style.opacity = '1';
                brainrotCard.style.pointerEvents = 'auto';
            });
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // ─── Модальное окно ───
        function openModal(src, name) {
            modalImg.src = src;
            modalTitle.innerText = name;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = '';
        }

        modal.onclick = e => { if (e.target === modal) closeModal(); };

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeModal();
        });
    </script>
</body>
</html>
